; Heltec Vision Master T190 - LoRa Field Test (samodzielny tester, wlasny firmware)
; Dwa warianty srodowiska: t190 (kolory RGB) i t190_bgr (gdyby czerwony i niebieski byly zamienione).
[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.1.2
    bodmer/TFT_eSPI@2.5.43
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_MISO=4
    -DTFT_MOSI=48
    -DTFT_SCLK=38
    -DTFT_CS=39
    -DTFT_DC=47
    -DTFT_RST=40
    -DTFT_BL=-1
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:t190]
build_flags = ${env.build_flags}
    -DTFT_RGB_ORDER=TFT_RGB

[env:t190_bgr]
build_flags = ${env.build_flags}
    -DTFT_RGB_ORDER=TFT_BGR
